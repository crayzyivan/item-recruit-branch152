<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>职位已被拒绝</title>
    <style>
        body { font-family: Arial, sans-serif; line-height: 1.6; color: #333; }
        .container { max-width: 600px; margin: 0 auto; padding: 20px; }
        .header { background-color: #f8d7da; padding: 20px; border-radius: 5px; margin-bottom: 20px; border: 1px solid #f5c6cb; }
        .content { padding: 20px; }
        .denied { color: #721c24; }
        .comment-box { background-color: #f8f9fa; padding: 15px; border-radius: 5px; margin: 20px 0; border-left: 4px solid #dc3545; }
        .footer { margin-top: 30px; padding-top: 20px; border-top: 1px solid #eee; font-size: 12px; color: #666; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h2 class="denied">职位已被拒绝</h2>
        </div>

        <div class="content">
            <p>很遗憾，您的职位发布未通过审核：</p>

            <h3>职位详情：</h3>
            <ul>
                <li><strong>职位名称：</strong> <span th:text="${jobTitle}">Job Title</span></li>
                <li><strong>职位 ID：</strong> <span th:text="${jobId}">Job ID</span></li>
                <li><strong>公司编码：</strong> <span th:text="${companyCode}">Company Code</span></li>
            </ul>

            <p class="denied"><strong>状态：已拒绝</strong></p>

            <div class="comment-box" th:if="${comment != null and comment != ''}">
                <h4>拒绝原因：</h4>
                <p th:text="${comment}">Admin comment</p>
            </div>

            <p>请根据反馈意见对职位进行修改，并在完善后重新提交审核。</p>

            <p>如您对本次拒绝有任何疑问，或在修改职位时需要帮助，请联系您的管理员。</p>
        </div>

        <div class="footer">
            <p>本邮件由职位审核系统自动发送。</p>
            <p>请勿直接回复本邮件。</p>
        </div>
    </div>
</body>
</html>
