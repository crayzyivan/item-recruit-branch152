<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>职位申请邀请</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f9f9f9; margin: 0; padding: 0; }
        .container { background: #fff; padding: 24px; border-radius: 8px; max-width: 500px; margin: 40px auto; box-shadow: 0 2px 8px #eee; }
        .header { color: #2d8cf0; font-size: 1.5em; font-weight: bold; margin-bottom: 20px; }
        .job-title { color: #2d8cf0; font-size: 1.2em; font-weight: bold; margin: 16px 0; }
        .message { line-height: 1.6; margin: 16px 0; }
        .info-box { background: #f5f5f5; padding: 16px; border-radius: 4px; margin: 16px 0; }
        .info-label { font-weight: bold; color: #333; }
        .info-value { color: #666; margin-left: 8px; }
        .button { display: inline-block; background: #2d8cf0; color: #fff; padding: 12px 24px; text-decoration: none; border-radius: 4px; margin: 16px 0; }
        .footer { color: #888; font-size: 12px; margin-top: 30px; }
        .warning { color: #ff6b6b; font-size: 0.9em; margin-top: 16px; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">职位申请邀请</div>
    
    <div class="message">
        尊敬的 <span th:text="${candidateName}">候选人</span>，
    </div>
    
    <div class="message">
        您已被邀请申请以下职位：
    </div>
    
    <div class="job-title" th:text="${jobTitle}">职位名称</div>
    
    <div class="message">
        公司：<strong th:text="${companyName}">公司名称</strong>
    </div>
    
    <div class="message">
        请点击下面的链接查看职位详情并提交您的申请：
    </div>
    
    <div class="message">
        <a th:href="${jobUrl}" class="button" style="color: #fff; text-decoration: none;">查看职位详情</a>
    </div>
    
    <div class="info-box">
        <div class="message">
            <span class="info-label">您的账号信息：</span>
        </div>
        <div class="message">
            <span class="info-label">邮箱（用户名）：</span>
            <span class="info-value" th:text="${iamAccount}">your.email@example.com</span>
        </div>
        <div class="message" th:if="${showPassword}">
            <span class="info-label">初始密码：</span>
            <span class="info-value" th:text="${password}">Password123!</span>
        </div>
    </div>
    
    <div class="message" th:if="${showPassword}">
        请使用上述凭据登录招聘系统并提交您的申请。
    </div>
    
    <div class="message" th:if="${!showPassword}">
        请使用您现有的账号凭据登录招聘系统并提交您的申请。
    </div>
    
    <div class="warning" th:if="${showPassword}">
        <strong>安全提示：</strong> 为了您的账号安全，请在首次登录后更改密码。
    </div>
    
    <div class="footer">
        <p>此致<br/>招聘团队</p>
    </div>
</div>
</body>
</html>
