<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>职位被驳回 - 需要修改</title>
    <style>
        body { font-family: Arial, sans-serif; line-height: 1.6; color: #333; }
        .container { max-width: 600px; margin: 0 auto; padding: 20px; }
        .header { background-color: #fff3cd; padding: 20px; border-radius: 5px; margin-bottom: 20px; border: 1px solid #ffeaa7; }
        .content { padding: 20px; }
        .warning { color: #856404; }
        .comment-box { background-color: #f8f9fa; padding: 15px; border-radius: 5px; margin: 20px 0; border-left: 4px solid #ffc107; }
        .footer { margin-top: 30px; padding-top: 20px; border-top: 1px solid #eee; font-size: 12px; color: #666; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h2 class="warning">职位被驳回 - 需要修改</h2>
        </div>

        <div class="content">
            <p>您的职位在通过审核前需要进行一些修改：</p>

            <h3>职位详情：</h3>
            <ul>
                <li><strong>职位名称：</strong> <span th:text="${jobTitle}">Job Title</span></li>
                <li><strong>职位 ID：</strong> <span th:text="${jobId}">Job ID</span></li>
                <li><strong>公司编码：</strong> <span th:text="${companyCode}">Company Code</span></li>
            </ul>

            <p class="warning"><strong>状态：已驳回 - 需要修改</strong></p>

            <div class="comment-box" th:if="${comment != null and comment != ''}">
                <h4>需要修改的内容：</h4>
                <p th:text="${comment}">Admin comment</p>
            </div>

            <p>请认真查看管理员提供的修改建议，并根据反馈对职位进行调整。完成修改后，请重新提交职位以供审核。</p>

            <p>职位修改并重新提交后，管理员会再次进行审核。</p>

            <p>如果您对修改建议有任何疑问，或在调整职位时需要帮助，请联系您的管理员。</p>
        </div>

        <div class="footer">
            <p>本邮件由职位审核系统自动发送。</p>
            <p>请勿直接回复本邮件。</p>
        </div>
    </div>
</body>
</html>
