<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>职位推荐邀请</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f9f9f9; margin: 0; padding: 0; }
        .container { background: #fff; padding: 24px; border-radius: 8px; max-width: 500px; margin: 40px auto; box-shadow: 0 2px 8px #eee; }
        .header { color: #2d8cf0; font-size: 1.5em; font-weight: bold; margin-bottom: 20px; }
        .job-title { color: #2d8cf0; font-size: 1.2em; font-weight: bold; margin: 16px 0; }
        .message { line-height: 1.6; margin: 16px 0; }
        .footer { color: #888; font-size: 12px; margin-top: 30px; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">职位推荐邀请</div>

    <div class="message">
        尊敬的 <span th:text="${candidateName}">候选人</span>，
    </div>

    <div class="message">
        您被邀请申请以下职位：
    </div>

    <div class="job-title" th:text="${jobTitle}">职位标题</div>

    <div class="message">
        公司：<strong th:text="${companyName}">公司名称</strong>
    </div>

    <div class="message">
        请点击下方链接提交您的申请：
    </div>

    <div class="message">
        <a th:href="${jobUrl}" style="color: #2d8cf0; text-decoration: none; font-weight: bold;">立即申请</a>
    </div>

    <div class="footer">
        <p>此致<br/>招聘团队</p>
    </div>
</div>
</body>
</html>
