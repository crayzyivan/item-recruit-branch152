<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Welcome Email</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f9f9f9; }
        .container { background: #fff; padding: 24px; border-radius: 8px; max-width: 500px; margin: 40px auto; box-shadow: 0 2px 8px #eee; }
        .code { color: #2d8cf0; font-size: 1.5em; font-weight: bold; }
    </style>
</head>
<body>
<div class="container">
    <h2>Hello, <span th:text="${username}"></span>!</h2>
    <p>Welcome to our service.</p>
    <p>Your verification code is: <span class="code" th:text="${code}"></span></p>
    <p style="color:#888;font-size:12px;">If this is not your operation, please ignore this email.</p>
</div>
</body>
</html>
