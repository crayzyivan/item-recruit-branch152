<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>职位审核申请</title>
    <style>
        body { font-family: Arial, sans-serif; line-height: 1.6; color: #333; }
        .container { max-width: 600px; margin: 0 auto; padding: 20px; }
        .header { background-color: #f8f9fa; padding: 20px; border-radius: 5px; margin-bottom: 20px; }
        .content { padding: 20px; }
        .footer { margin-top: 30px; padding-top: 20px; border-top: 1px solid #eee; font-size: 12px; color: #666; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h2>职位审核申请</h2>
        </div>

        <div class="content">
            <p>有新的职位已提交审核：</p>

            <h3>职位详情：</h3>
            <ul>
                <li><strong>职位名称：</strong> <span th:text="${jobTitle}">Job Title</span></li>
                <li><strong>职位 ID：</strong> <span th:text="${jobId}">Job ID</span></li>
                <li><strong>公司编码：</strong> <span th:text="${companyCode}">Company Code</span></li>
            </ul>

            <p>请在职位审核工作台中审阅该职位并执行相应操作（通过或驳回）。</p>
        </div>

        <div class="footer">
            <p>本邮件由职位审核系统自动发送。</p>
            <p>请勿直接回复本邮件。</p>
        </div>
    </div>
</body>
</html>
