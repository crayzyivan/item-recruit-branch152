<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>职位审核通过</title>
    <style>
        body { font-family: Arial, sans-serif; line-height: 1.6; color: #333; }
        .container { max-width: 600px; margin: 0 auto; padding: 20px; }
        .header { background-color: #d4edda; padding: 20px; border-radius: 5px; margin-bottom: 20px; border: 1px solid #c3e6cb; }
        .content { padding: 20px; }
        .success { color: #155724; }
        .footer { margin-top: 30px; padding-top: 20px; border-top: 1px solid #eee; font-size: 12px; color: #666; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h2 class="success">职位审核通过</h2>
        </div>

        <div class="content">
            <p>好消息！您的职位已通过审核。</p>

            <h3>职位详情：</h3>
            <ul>
                <li><strong>职位名称：</strong> <span th:text="${jobTitle}">Job Title</span></li>
                <li><strong>职位 ID：</strong> <span th:text="${jobId}">Job ID</span></li>
                <li><strong>公司编码：</strong> <span th:text="${companyCode}">Company Code</span></li>
            </ul>

            <p class="success"><strong>状态：已审核通过</strong></p>

            <p>您的职位已通过审核。主账号发布后，求职者即可查看并申请该职位。</p>

            <p>如有任何疑问或需要帮助，请联系您的管理员。</p>
        </div>

        <div class="footer">
            <p>本邮件由职位审核系统自动发送。</p>
            <p>请勿直接回复本邮件。</p>
        </div>
    </div>
</body>
</html>
